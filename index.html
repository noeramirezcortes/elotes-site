<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don Elote - Elotes Mexicanos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="css/custom.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="corn-pattern min-h-screen" x-data="eloteApp()">
    
    <!-- Hero Section -->
    <header class="bg-gradient-to-br from-amber-600 to-orange-700 text-white py-12 px-4 shadow-lg">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-3 tracking-tight">🌽 Don Elote</h1>
            <p class="text-xl md:text-2xl font-medium text-amber-100">Elotes Mexicanos Auténticos</p>
            <p class="mt-4 text-amber-200 text-sm md:text-base">El sabor de la calle, en tu mesa</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Product Menu -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold text-amber-900 mb-6 border-b-2 border-amber-400 pb-2">Nuestros Elotes</h2>
            
            <div class="grid gap-6 md:grid-cols-2">
                <template x-for="product in products" :key="product.id">
                    <div class="bg-white rounded-xl shadow-md p-6 border-2 border-amber-200 hover:border-amber-400 transition-colors">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold text-amber-900" x-text="product.name"></h3>
                                <p class="text-gray-600 text-sm mt-1" x-text="product.description"></p>
                            </div>
                            <span class="text-2xl font-bold text-amber-600" x-text="'$' + product.basePrice"></span>
                        </div>
                        
                        <!-- Size Selector -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-amber-800 mb-2">Tamaño:</label>
                            <div class="flex gap-2">
                                <template x-for="size in sizes" :key="size.id">
                                    <button 
                                        @click="selectSize(product.id, size.id)"
                                        :class="{'bg-amber-500 text-white': selectedSizes[product.id] === size.id, 'bg-amber-100 text-amber-800 hover:bg-amber-200': selectedSizes[product.id] !== size.id}"
                                        class="px-4 py-2 rounded-lg font-medium transition-colors text-sm"
                                        x-text="size.name">
                                    </button>
                                </template>
                            </div>
                        </div>
                        
                        <!-- Additional Ingredients -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-amber-800 mb-2">Ingredientes Adicionales:</label>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="ingredient in ingredients" :key="ingredient.id">
                                    <button 
                                        @click="toggleIngredient(product.id, ingredient.id)"
                                        :class="{'bg-orange-500 text-white': selectedIngredients[product.id]?.includes(ingredient.id), 'bg-orange-100 text-orange-800 hover:bg-orange-200': !selectedIngredients[product.id]?.includes(ingredient.id)}"
                                        class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
                                        x-text="ingredient.name + ' (+$' + ingredient.price + ')'">
                                    </button>
                                </template>
                            </div>
                        </div>
                        
                        <!-- Add to Cart Button -->
                        <button 
                            @click="addToCart(product)"
                            class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white py-3 rounded-lg font-semibold hover:from-amber-600 hover:to-orange-600 transition-all shadow-md hover:shadow-lg">
                            Agregar al Carrito
                        </button>
                    </div>
                </template>
            </div>
        </section>

        <!-- Shopping Cart -->
        <section class="bg-white rounded-xl shadow-lg p-6 border-2 border-amber-300">
            <h2 class="text-2xl font-bold text-amber-900 mb-6 border-b-2 border-amber-400 pb-2 flex items-center justify-between">
                <span>🛒 Tu Pedido</span>
                <span class="text-lg font-medium text-amber-700" x-text="cart.length + ' artículo(s)'"></span>
            </h2>
            
            <template x-if="cart.length === 0">
                <p class="text-gray-500 text-center py-8">Tu carrito está vacío</p>
            </template>
            
            <template x-if="cart.length > 0">
                <div>
                    <div class="space-y-4 mb-6">
                        <template x-for="(item, index) in cart" :key="index">
                            <div class="flex justify-between items-start p-4 bg-amber-50 rounded-lg border border-amber-200">
                                <div class="flex-1">
                                    <h4 class="font-semibold text-amber-900" x-text="item.product.name"></h4>
                                    <p class="text-sm text-amber-700">
                                        <span x-text="item.size.name"></span>
                                        <template x-if="item.ingredients.length > 0">
                                            <span x-text="' + ' + item.ingredients.map(i => i.name).join(', ')"></span>
                                        </template>
                                    </p>
                                    <p class="text-lg font-bold text-amber-600 mt-1" x-text="'$' + item.total.toFixed(2)"></p>
                                </div>
                                <button 
                                    @click="removeFromCart(index)"
                                    class="text-red-500 hover:text-red-700 font-medium text-sm ml-4">
                                    Eliminar
                                </button>
                            </div>
                        </template>
                    </div>
                    
                    <!-- Order Summary -->
                    <div class="border-t-2 border-amber-300 pt-4 mb-6">
                        <div class="flex justify-between items-center text-xl font-bold">
                            <span class="text-amber-900">Total:</span>
                            <span class="text-amber-600" x-text="'$' + calculateTotal().toFixed(2)"></span>
                        </div>
                    </div>
                    
                    <!-- WhatsApp Order Button -->
                    <button 
                        @click="sendWhatsAppOrder()"
                        class="w-full bg-green-500 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-600 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                        </svg>
                        Enviar Pedido por WhatsApp
                    </button>
                </div>
            </template>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-amber-800 text-amber-100 py-6 mt-12">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <p class="font-medium">🌽 Don Elote - Elotes Mexicanos Auténticos</p>
            <p class="text-sm mt-2 text-amber-200">El mejor sabor de la calle</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
